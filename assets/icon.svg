<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3733"/>
      <stop offset="1" stop-color="#0b1817"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fae82"/>
      <stop offset="1" stop-color="#e8c675"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="44" fill="none" stroke="#3f5f56" stroke-width="2" opacity="0.5"/>

  <g filter="url(#glow)">
    <circle cx="82" cy="180" r="34" fill="url(#trail)"/>
    <circle cx="142" cy="120" r="24" fill="url(#trail)" opacity="0.82"/>
    <circle cx="188" cy="74" r="15" fill="url(#trail)" opacity="0.65"/>
  </g>
</svg>
