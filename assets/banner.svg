<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3733"/>
      <stop offset="1" stop-color="#0b1817"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fae82"/>
      <stop offset="1" stop-color="#e8c675"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <path d="M0,420 L0,330 C220,290 420,350 640,320 C860,290 1020,340 1200,300 L1200,420 Z"
        fill="#132422" opacity="0.7"/>

  <text x="56" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="66"
        fill="#f2ead9" font-weight="700">FollowPlayer</text>
  <text x="58" y="160" font-family="Verdana, Geneva, sans-serif" font-size="22"
        fill="#a9c9bd">Auto-walk to trail another player in Valheim</text>

  <!-- ===================== FOLLOWER VIKING ===================== -->
  <g transform="translate(650,155) scale(0.86)">
    <!-- back arm reaching forward -->
    <line x1="150" y1="105" x2="182" y2="112" stroke="#c97b3b" stroke-width="20" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="95" y1="195" x2="72" y2="248" stroke="#7a4a2a" stroke-width="24" stroke-linecap="round"/>
    <line x1="108" y1="195" x2="140" y2="250" stroke="#8a5530" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="70" cy="253" rx="16" ry="9" fill="#2a1c12"/>
    <ellipse cx="142" cy="255" rx="16" ry="9" fill="#2a1c12"/>
    <!-- tunic -->
    <path d="M62,95 L140,95 L128,190 L74,190 Z" fill="#c97b3b"/>
    <rect x="70" y="150" width="62" height="13" fill="#4a2f18"/>
    <!-- front arm reaching forward, fingers just short of the other viking -->
    <line x1="132" y1="108" x2="176" y2="88" stroke="#c97b3b" stroke-width="20" stroke-linecap="round"/>
    <circle cx="180" cy="85" r="10" fill="#e0a874"/>
    <!-- head -->
    <circle cx="100" cy="60" r="32" fill="#e0a874"/>
    <ellipse cx="100" cy="43" rx="35" ry="25" fill="#8a8f93"/>
    <rect x="66" y="45" width="68" height="10" rx="5" fill="#6a6f73"/>
    <path d="M72,48 Q52,15 40,28 Q56,40 70,54 Z" fill="#e7e0d2"/>
    <path d="M128,48 Q148,15 160,28 Q144,40 130,54 Z" fill="#e7e0d2"/>
    <!-- happy eager face -->
    <circle cx="80" cy="70" r="7" fill="#e8a6a0" opacity="0.7"/>
    <circle cx="120" cy="70" r="7" fill="#e8a6a0" opacity="0.7"/>
    <path d="M84,58 Q90,50 96,58" stroke="#2a1c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M104,58 Q110,50 116,58" stroke="#2a1c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M80,76 Q100,96 120,76" stroke="#2a1c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- beard -->
    <path d="M78,82 Q100,110 122,82 Q112,100 100,102 Q88,100 78,82 Z" fill="#d8cdb8"/>
  </g>

  <!-- speed lines behind the fleeing viking's trailing leg -->
  <g stroke="#4a6a62" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <line x1="845" y1="330" x2="895" y2="326"/>
    <line x1="838" y1="352" x2="888" y2="348"/>
    <line x1="848" y1="374" x2="898" y2="370"/>
  </g>

  <!-- ===================== FLEEING VIKING ===================== -->
  <g transform="translate(875,120)">
    <!-- trailing arm -->
    <line x1="60" y1="100" x2="18" y2="132" stroke="#3f6f8f" stroke-width="20" stroke-linecap="round"/>
    <!-- legs: mid-sprint -->
    <line x1="88" y1="190" x2="58" y2="222" stroke="#2f4f66" stroke-width="24" stroke-linecap="round"/>
    <line x1="110" y1="190" x2="152" y2="246" stroke="#3a5c76" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="55" cy="226" rx="16" ry="9" fill="#1c2c38"/>
    <ellipse cx="154" cy="251" rx="16" ry="9" fill="#1c2c38"/>
    <!-- tunic, leaning forward to run -->
    <path d="M58,92 L142,98 L124,190 L72,190 Z" fill="#4a7a9c"/>
    <rect x="76" y="148" width="58" height="12" fill="#233c4d"/>
    <!-- forward arm swung up -->
    <line x1="132" y1="100" x2="168" y2="66" stroke="#4a7a9c" stroke-width="20" stroke-linecap="round"/>
    <!-- head, looking back over shoulder -->
    <circle cx="100" cy="58" r="32" fill="#e0a874"/>
    <ellipse cx="100" cy="41" rx="35" ry="25" fill="#8a8f93"/>
    <rect x="66" y="43" width="68" height="10" rx="5" fill="#6a6f73"/>
    <path d="M72,46 Q52,13 40,26 Q56,38 70,52 Z" fill="#e7e0d2"/>
    <path d="M128,46 Q148,13 160,26 Q144,38 130,52 Z" fill="#e7e0d2"/>
    <!-- alarmed face, turned toward follower -->
    <path d="M62,52 Q68,40 78,44" stroke="#2a1c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M86,50 Q92,38 102,42" stroke="#2a1c12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="70" cy="58" rx="9" ry="10" fill="#f5f0e6"/>
    <circle cx="67" cy="60" r="4" fill="#1c1410"/>
    <ellipse cx="93" cy="58" rx="9" ry="10" fill="#f5f0e6"/>
    <circle cx="90" cy="60" r="4" fill="#1c1410"/>
    <ellipse cx="80" cy="80" rx="7" ry="9" fill="#7a3020"/>
    <!-- sweat drop -->
    <path d="M138,34 Q150,50 138,58 Q126,50 138,34 Z" fill="#bfe3f0"/>
    <!-- beard -->
    <path d="M76,84 Q100,108 124,84 Q112,98 100,100 Q88,98 76,84 Z" fill="#d8cdb8"/>
  </g>
</svg>
