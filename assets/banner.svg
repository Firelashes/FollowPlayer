<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3733"/>
      <stop offset="1" stop-color="#0b1817"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fae82"/>
      <stop offset="1" stop-color="#e8c675"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <path d="M0,320 L0,250 C200,210 380,270 620,235 C860,200 1040,255 1200,220 L1200,320 Z"
        fill="#132422" opacity="0.7"/>

  <g filter="url(#glow)">
    <circle cx="120" cy="160" r="30" fill="url(#trail)"/>
    <circle cx="180" cy="112" r="21" fill="url(#trail)" opacity="0.82"/>
    <circle cx="226" cy="76" r="13" fill="url(#trail)" opacity="0.65"/>
  </g>

  <text x="300" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72"
        fill="#f2ead9" font-weight="700">FollowPlayer</text>
  <text x="302" y="196" font-family="Verdana, Geneva, sans-serif" font-size="24"
        fill="#a9c9bd">A client-side Valheim mod that auto-walks you to another player</text>
</svg>
