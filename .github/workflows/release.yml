name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet build -c Release

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Release/net462/FollowPlayer.dll dist/
          cp README.md LICENSE manifest.json icon.png dist/
          cd dist && zip -r ../FollowPlayer-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: FollowPlayer-${{ github.ref_name }}.zip
